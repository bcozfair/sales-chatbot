# พรีวิวร่วมของเครื่อง PMSV — โค้ดล่าสุดของ main ก่อน deploy · ทุก session ดูที่เดียวกัน
#   http://localhost:5180/admin.html      (ผ่าน port forwarding ของ VSCode)
# คู่มือเต็ม: docs/dev-preview.md
#
#   docker compose -f docker-compose.preview.yml up -d          # เปิด / เปิดใหม่หลังแก้ไฟล์นี้
#   docker compose -f docker-compose.preview.yml logs -f api    # ดู log backend ของพรีวิว
#   docker compose -f docker-compose.preview.yml down           # ปิด (ไม่แตะตัวจริง)
#
# ⚠️ ต้องสั่งจาก working tree หลัก (/home/app_sales/salechatbot/chatbot) เท่านั้น — `./` คือ
#    โค้ดที่พรีวิวจะรัน สั่งจาก worktree ของ session ไหน 5180 ก็จะกลายเป็นโค้ดของ session นั้น
#
# เป็น project แยก (`name:` ข้างล่าง) โดยตั้งใจ ⇒ `docker compose up -d --build` ของ deploy
# ไม่แตะสองกล่องนี้ และ `down` ของพรีวิวก็ไม่แตะ app/db/tunnel ของตัวจริง
# ⚠️ **ใช้ฐานข้อมูลตัวจริง** (ฐานเดียวบนเครื่องนี้) — กดยืนยันใบในพรีวิว = ออกเลขใบจริง
name: primus-chatbot-preview

services:
  # backend: โค้ดจาก ./ (อ่านอย่างเดียว) + node_modules จากอิมเมจของตัวจริง · แก้ .ts แล้วรีสตาร์ตเอง
  api:
    image: primus-chatbot-app:latest
    restart: unless-stopped
    init: true
    working_dir: /app
    command: ["node_modules/.bin/tsx", "watch", "--clear-screen=false", "index.ts"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      PORT: "3011"
      NODE_ENV: production
      TZ: Asia/Bangkok
      # ปิด auto sync + เปิด /__preview/boot — ดู PREVIEW_MODE ใน index.ts
      PREVIEW_MODE: "1"
    volumes:
      - ./:/app:ro
      # anonymous volume = ก๊อป node_modules ของอิมเมจมาตอนสร้างกล่อง (ของรีโปบนโฮสต์ว่างเปล่า)
      # dependency ของ backend เปลี่ยน ⇒ build อิมเมจใหม่แล้ว `up -d --force-recreate -V api`
      - /app/node_modules
      # ลายเซ็นใช้ volume เดียวกับตัวจริง — ฐานก็ตัวเดียวกัน ไฟล์กับแถวในฐานจึงต้องไปด้วยกัน
      - sig_sale:/app/data/sale_sigs
      - sig_admin:/app/data/admin_sigs
    networks: [chatbot]
    # ไม่ publish พอร์ต — เข้าผ่าน Vite ของกล่อง web เท่านั้น

  # frontend: Vite + HMR ที่ 5180 (พอร์ตที่เจ้าของเปิดดูประจำ) · ส่ง /api /data /download-pdf ไปที่ api
  web:
    image: node:22-bookworm-slim
    restart: unless-stopped
    init: true
    # uid ของ app_sales — ไม่ให้กล่องสร้างไฟล์ของ root ทิ้งไว้ในรีโป (ซึ่งเมานต์อ่านอย่างเดียวอยู่แล้ว)
    user: "1000:1000"
    working_dir: /app/frontend
    command: ["node", "node_modules/.bin/vite",
              "--config", "/app/scripts/preview/vite.config.mjs", "--host", "0.0.0.0"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PREVIEW_API: http://api:3011
    volumes:
      # frontend/node_modules มาจากโฮสต์ (`npm --prefix frontend install`) — แพ็กเกจเปลี่ยนต้องลงบนโฮสต์ก่อน
      - ./:/app:ro
      # Vite คอมไพล์ config แล้วเขียนไฟล์ชั่วคราวลง `node_modules/.vite-temp` ที่ใกล้ไฟล์ config ที่สุด
      # = /app/node_modules (รากรีโป · อ่านอย่างเดียว) ⇒ วาง tmpfs ทับให้เขียนได้
      # ทางที่ไม่ได้เลือก: `--configLoader runner` ไม่ต้องเขียนไฟล์ แต่ไม่มี `__dirname` ให้
      # frontend/vite.config.ts ⇒ ล้มตั้งแต่โหลด config (ลองแล้ว 2026-09-24)
      - type: tmpfs
        target: /app/node_modules
        tmpfs:
          mode: 01777
    ports:
      - "127.0.0.1:5180:5180"
    depends_on: [api]
    networks: [chatbot]

networks:
  # network ของตัวจริง — ต้องคุยกับ `db` ซึ่งไม่ได้ publish พอร์ตออกโฮสต์
  chatbot:
    name: primus-chatbot_default
    external: true

volumes:
  sig_sale:
    name: primus-chatbot_sig_sale
    external: true
  sig_admin:
    name: primus-chatbot_sig_admin
    external: true
