# ชื่อ project → ตั้ง prefix ให้ container/volume/network ไม่ชนโปรเจคอื่นบน server รวม
name: primus-chatbot

services:
  db:
    image: postgres:18
    restart: unless-stopped
    # จำกัดขนาด log ไม่ให้โตไม่จำกัด: เก็บ 5 ไฟล์ ไฟล์ละ 10MB (รวมสูงสุด ~50MB) แล้ว rotate ทับของเก่า
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # บังคับ TimeZone ของ server เป็นไทย — image postgres ตั้งต้นเป็น UTC (initdb อ่านจาก OS ในคอนเทนเนอร์)
    # ต้องสั่งผ่าน command เพราะค่า timezone ถูกเขียนลง postgresql.conf ตั้งแต่ initdb แล้ว
    # การใส่ env TZ ทีหลังไม่เปลี่ยนค่าใน volume เดิม
    # หมายเหตุ: เงื่อนไข SQL ทุกจุดถูกเขียนให้ไม่ขึ้นกับ TimeZone ของ session อยู่แล้ว บรรทัดนี้เป็นกันเหนียว
    # + ทำให้ log/psql อ่านเป็นเวลาไทย ไม่ใช่ตัวที่ความถูกต้องไปพึ่งพา
    # shared_preload_libraries ต้องสั่งตอน start เท่านั้น (ALTER SYSTEM ก็ต้อง restart อยู่ดี)
    # pg_stat_statements = แผน G ฝั่ง DB — ตอบว่า "query ไหนกินเวลารวมมากที่สุด" ซึ่ง api_logs
    # ตอบไม่ได้ (มันเห็นแค่ระดับ request ไม่เห็นว่าใน request นั้นยิง query อะไรไปบ้าง)
    # ต้นทุน: shared memory ~1-2 MB + overhead ต่อ query ระดับ µs · ต้อง CREATE EXTENSION ด้วย
    # (migrations/changes/2026-09-03_02_pg_stat_statements.sql)
    command: ["postgres", "-c", "timezone=Asia/Bangkok", "-c", "log_timezone=Asia/Bangkok",
              "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      TZ: Asia/Bangkok
    volumes:
      # postgres:18 เก็บ data ในซับไดเรกทอรีตาม major version → ต้อง mount ที่ /var/lib/postgresql (พาเรนต์) ไม่ใช่ /data
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # ไม่ publish port 5432 ออก host → app คุยกับ db ผ่าน network ภายในชื่อ "db" เท่านั้น (ปลอดภัย + ไม่ชนโปรเจคอื่น)
    # ถ้าเครื่องไหนต้องต่อ db จากภายนอก (เช่น VSCode DB extension) ให้ publish ใน docker-compose.override.yml ของเครื่องนั้น

  app:
    build: .
    restart: unless-stopped
    # C.4 — tini เป็น PID 1: ส่งต่อ SIGTERM ให้ node (ลูกตรง) + เก็บ zombie process
    # ที่ esbuild ของ tsx ทิ้งไว้ (ของเดิมค้างสะสมเพราะ npm ไม่ได้ทำหน้าที่ init)
    init: true
    # C.4 — docker ให้เวลาหลัง SIGTERM แค่ 10 วิเป็น default แล้ว SIGKILL ทิ้ง
    # ซึ่งสั้นกว่าเวลาที่ข้อความ 1 ตัวใช้ตอบ (งบ 48 วิ) ⇒ ทุก deploy = ข้อความในคิวหายเงียบยกชุด
    # 60 วิ = งบ 48 วิ + เวลาปิด Chrome + เผื่อ · แอปมี hard exit ที่ 55 วิ ตัดหน้าอยู่แล้ว
    # ปกติ restart จะเร็วเหมือนเดิม เพราะ drain คืนค่าทันทีถ้าคิวว่าง — 60 วิคือเพดาน ไม่ใช่เวลาที่รอทุกครั้ง
    stop_grace_period: 60s
    # จำกัดขนาด log ไม่ให้โตไม่จำกัด: เก็บ 5 ไฟล์ ไฟล์ละ 10MB (รวมสูงสุด ~50MB) แล้ว rotate ทับของเก่า
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file: .env
    environment:
      PG_HOST: db          # ชี้ไปที่ service db (override ค่าใน .env)
      PG_PORT: "5432"
      PORT: "3011"
      NODE_ENV: production
      # เวลาท้องถิ่นของ Node = ไทย → log ของแอปอ่านเป็นเวลาไทย
      # โค้ดที่ต้องการ "วันไทย" (วันที่บนหัว PDF, งวด yymm ของเลขใบเสนอราคา) ปัก Asia/Bangkok
      # ไว้ในตัวเองผ่าน utils/thaiTime.ts แล้ว บรรทัดนี้จึงเป็นกันเหนียว ไม่ใช่ตัวที่ความถูกต้องไปพึ่งพา
      TZ: Asia/Bangkok
    depends_on:
      db:
        condition: service_healthy
    # ผูกที่ 127.0.0.1 → เข้าถึงได้เฉพาะ reverse proxy กลางที่รันบน host
    # APP_PORT = พอร์ต host ที่ IT จะ route subdomain มา (ตั้งใน .env; default 3011)
    ports:
      - "127.0.0.1:${APP_PORT:-3011}:3011"
    volumes:
      - sig_sale:/app/data/sale_sigs     # รูปลายเซ็นที่อัปโหลด (คงอยู่ข้าม rebuild)
      - sig_admin:/app/data/admin_sigs

  # ทางเข้าสาธารณะของระบบ — `https://salechatbot.primus-iot.com` คือปลายทางที่ LINE ยิง webhook มา
  # ไม่มี reverse proxy ของ IT อยู่ในเส้นนี้ (ของเดิมเขียนไว้ว่ามี — ไม่จริงตั้งแต่ 2026-09-02)
  #
  # ⚠️ ห้ามใส่ `network_mode: host` เลียนแบบ primus-chat — ingress rule ของ tunnel ตัวนี้ชี้ไปที่
  #    **`http://app:3011`** ซึ่งเป็นชื่อบน network ของ compose ไม่ใช่ `127.0.0.1` ของ host
  #    (rule อยู่บน Cloudflare dashboard ฝั่ง remote ไม่ได้อยู่ในไฟล์นี้ — `--token` ดึงมาให้เอง)
  #    ย้ายไป host mode เมื่อไหร่ `app` จะ resolve ไม่ได้ ⇒ โดเมนขึ้น DNS ปกติแต่ตอบ 502 ตลอด
  #    โดยไม่มี error ให้เห็นสักบรรทัด (primus-chat เจอเคสกลับด้านกันมาแล้ว)
  #
  # ⚠️ ห้ามถอด `--protocol http2` — UDP/QUIC ออกจากเครื่องนี้ไม่ได้ cloudflared ตรวจเองตอน boot
  #    แล้วรายงาน `UDP Connectivity region1/region2 = FAIL · TCP = PASS` (วัด 2026-09-02)
  #    ถอดแล้วมันจะไปลอง QUIC ก่อนทุกครั้งแล้วค่อยถอยมา http2 = ต่อช้าลงทุกรอบโดยไม่ได้อะไร
  #
  # ไม่ผูก `depends_on: app` โดยตั้งใจ — tunnel ต้องอยู่ต่อระหว่าง app restart ตอน deploy
  # ไม่งั้นทางเข้าหายไปด้วยทั้งที่ไม่จำเป็น (ระหว่างนั้นโดเมนตอบ 502 แล้วกลับมาเองเมื่อ app ขึ้น)
  # ⇒ `docker compose up -d --build` ปกติจะ **ไม่** แตะ container ตัวนี้ถ้านิยามไม่เปลี่ยน
  tunnel:
    image: cloudflare/cloudflared:latest
    # ไม่ตั้ง `container_name` โดยตั้งใจ ⇒ ได้ชื่อ `primus-chatbot-tunnel-1` เข้าชุดกับ app-1/db-1
    # เหตุผลที่ไม่ใช้ชื่อเดิม `cf-tunnel`: ตอนย้ายมา compose เราต้องการให้ตัวใหม่ขึ้นมา
    # **คู่กับตัวเก่าก่อน** แล้วค่อยดับตัวเก่า (โดเมนจึงไม่ล่มสักวินาที) ซึ่งทำไม่ได้ถ้าชื่อชนกัน
    # Cloudflare รองรับ connector หลายตัวต่อ tunnel เดียวโดยเจตนา (โหมด replica สำหรับ HA)
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run
    # ของเดิมรันด้วย `docker run` มือเปล่า ไม่มีเพดาน log — โตมา 20 วันโดยไม่มีใครดู
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      # token ของ tunnel ตัวนี้เท่านั้น (คนละตัวกับ primus-chat / primus-ot — สลับแล้วโดเมนสลับกัน)
      # ⚠️ ของเดิมฝัง token ไว้ใน args ของ `docker run` ⇒ ใครรัน `docker inspect` / `ps` บนเครื่องนี้
      #    ก็อ่านได้หมด และมันมีอยู่ที่เดียวในโลกคือ args ของ container ที่รันอยู่ + Cloudflare dashboard
      #    (ลบ container ทิ้งเมื่อไหร่ = ต้องไปออก token ใหม่) ⇒ ย้ายมาอยู่ใน .env ที่ backup ได้
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?ยังไม่ได้ตั้ง CF_TUNNEL_TOKEN ใน .env — ดู DEPLOY.md หัวข้อ "ทางเข้าสาธารณะ (Cloudflare Tunnel)"}

volumes:
  pgdata:
  sig_sale:
  sig_admin:
